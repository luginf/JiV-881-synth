# Based on https://github.com/OwlPlug/owlplug-scanner/blob/master/.github/workflows/main.yml
name: jiv881

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  # Projucer (JUCE 8.0.15's prebuilt binary) needs glibc >= 2.38 - confirmed by a failed run on ubuntu-22.04 -
  # so it runs here on 24.04, only to generate the Makefile. Nothing built on this runner is released: the
  # binaries must link against an OLD C library to run on older distributions (an AppImage in particular uses
  # the host's, see https://github.com/AppImage/appimage.github.io/pull/9619), so everything Linux is built in
  # build-linux-release below, in an ubuntu:22.04 container.
  generate-linux-build-files:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Download Projucer"
      run: |
           git clone -b 8.0.15 --depth 1 https://github.com/juce-framework/JUCE JUCE
           bash -ex ./build/download-projucer.sh
      shell: bash
      env:
        OS: linux
    - name: "Generate the Linux Makefile"
      run: ./build/bin/JUCE/Projucer --resave VirtualJiV.jucer
    # Named so that the release job's `jiv881-*` pattern does NOT pick it up (build input, not a release asset).
    - name: Upload generated build files
      uses: actions/upload-artifact@v4
      with:
        name: buildcfg-linux
        include-hidden-files: true
        path: |
              ./Builds/LinuxMakefile/Makefile
              ./Builds/LinuxMakefile/make_helpers
              ./Builds/LinuxMakefile/pre_build
              ./JuceLibraryCode
  # ubuntu:22.04 is the oldest Ubuntu LTS still supported; move this to the then-oldest one when it goes out of
  # support.
  build-linux-release:
    needs: generate-linux-build-files
    runs-on: ubuntu-latest
    container: ubuntu:22.04
    steps:
    - name: "Install build dependencies"
      run: |
           apt-get update
           DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
             build-essential cmake git curl ca-certificates file binutils pkg-config zip python3 \
             libasound2-dev libjack-jackd2-dev ladspa-sdk \
             libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
             libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
             libwebkit2gtk-4.1-dev libgtk-3-dev zsync
           # The generated Makefile queries pkg-config for webkit2gtk/gtk+alsa/freetype2/fontconfig/libcurl in a
           # single call - if ANY one is missing, pkg-config emits nothing for the whole call and the build breaks
           # with an unrelated-looking "ft2build.h not found". Hence webkit2gtk/gtk even though this project does
           # not use WebBrowserComponent.
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Fetch JUCE"
      run: git clone -b 8.0.15 --depth 1 https://github.com/juce-framework/JUCE JUCE
    - name: "Restore the generated build files"
      uses: actions/download-artifact@v4
      with:
        name: buildcfg-linux
        path: .
    - name: "Build Standalone, VST3 and LV2"
      run: |
           make -C Builds/LinuxMakefile CONFIG=Release -j"$(nproc)"
           cd Builds/LinuxMakefile
           strip build/JiV-881 build/JiV-881.lv2/JiV-881.so build/JiV-881.vst3/Contents/x86_64-linux/JiV-881.so
           rm -f build/JiV-881.a
    - name: "Build the CLAP"
      run: |
           cmake -S clap -B /tmp/jiv-clap -DCMAKE_BUILD_TYPE=Release
           cmake --build /tmp/jiv-clap --target JiV881_CLAP -j"$(nproc)"
           strip "$(find /tmp/jiv-clap -name 'JiV-881.clap' | head -1)"
    - name: "Package"
      run: |
           # the container's git refuses a workspace owned by another user ("dubious ownership")
           git config --global --add safe.directory "$GITHUB_WORKSPACE"
           bash -ex ./build/build-deb.sh
           mkdir -p dist
           cd Builds/LinuxMakefile/build
           zip -r ../../../dist/JiV-881.vst3.linux.zip JiV-881.vst3
           zip -r ../../../dist/JiV-881.lv2.linux.zip JiV-881.lv2
           cp JiV-881 ../../../dist/JiV-881.linux
           cd -
           zip -j dist/JiV-881.clap.linux.zip "$(find /tmp/jiv-clap -name 'JiV-881.clap' | head -1)"
           cp build/jiv881_amd64.deb dist/
           bash build/make-appimage.sh \
             --name JiV-881 \
             --binary Builds/LinuxMakefile/build/JiV-881 \
             --icon android/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png \
             --comment "Virtual JiV-881 sound module" \
             --version "$(git describe --tags --always)" \
             --update-info "gh-releases-zsync|luginf|JiV-881-synth|latest|JiV-881-*x86_64.AppImage.zsync" \
             --out dist
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jiv881-linux
        path: |
              dist/JiV-881.vst3.linux.zip
              dist/JiV-881.lv2.linux.zip
              dist/JiV-881.clap.linux.zip
              dist/JiV-881.linux
              dist/jiv881_amd64.deb
              dist/JiV-881-x86_64.AppImage
              dist/JiV-881-x86_64.AppImage.zsync
  build-win:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Download Projucer"
      run: |
           git clone -b 8.0.15 --depth 1 https://github.com/juce-framework/JUCE JUCE
           bash -ex ./build/download-projucer.sh
      shell: bash
      env:
        OS: windows
    - name: "Build jiv881"
      run: sh -ex ./build/build-win.sh
      shell: bash
    - name: "zip Windows VST3"
      # jiv881.vst3 is itself a bundle directory (Contents/x86_64-win/jiv881.vst3 +
      # Contents/Resources/moduleinfo.json), not a flat file - uploading it raw got flattened by
      # the release job's merge-multiple, scattering moduleinfo.json loose and leaving a bare
      # "jiv881.vst3" that was really just the inner DLL, not a valid bundle. Zip it like the
      # macOS/Linux jobs already do for their own bundles - `zip` itself isn't available in the
      # windows-2022 runner's Git-Bash, so PowerShell's Compress-Archive instead (needs the -Path
      # itself, not just its parent, since Git-Bash's cd above doesn't carry over to this step).
      run: Compress-Archive -Path "./Builds/VisualStudio2022/x64/Release/VST3/JiV-881.vst3" -DestinationPath "./Builds/VisualStudio2022/x64/Release/VST3/JiV-881.vst3.windows.zip"
      shell: pwsh
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jiv881-win
        path: |
              ./Builds/VisualStudio2022/x64/Release/VST3/JiV-881.vst3.windows.zip
              ./Builds/VisualStudio2022/x64/Release/Standalone Plugin/JiV-881.exe
  build-osx:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Download Projucer"
      run: |
           git clone -b 8.0.15 --depth 1 https://github.com/juce-framework/JUCE JUCE
           bash -ex ./build/download-projucer.sh
      shell: bash
      env:
        OS: osx
    - name: "Build macOS"
      run: sh -ex ./build/build-osx.sh
      shell: bash
    - name: "zip macOS"
      run: |
           cd ./Builds/MacOSX/build/Release/
           zip -r JiV-881.vst3.macOS.zip JiV-881.vst3
           zip -r JiV-881.component.macOS.zip JiV-881.component
           zip -r JiV-881.app.macOS.zip JiV-881.app
           cd -
      shell: bash
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jiv881-osx
        path: |
              ./Builds/MacOSX/build/Release/JiV-881.vst3.macOS.zip
              ./Builds/MacOSX/build/Release/JiV-881.component.macOS.zip
              ./Builds/MacOSX/build/Release/JiV-881.app.macOS.zip
  release:
    name: "Release"
    needs: [build-linux-release, build-win, build-osx]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: "ubuntu-latest"
    # This repo's default GITHUB_TOKEN permissions are read-only (Settings > Actions > General),
    # which made action-automatic-releases fail with "Resource not accessible by integration" -
    # explicitly requesting contents:write here overrides that default for just this job, rather
    # than loosening every job's token repo-wide.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3.3.0
      - name: Retrieve artifacts
        uses: actions/download-artifact@v4
        with:
          # A directory that doesn't already exist in the checked-out repo - `path: build` used
          # to land the downloaded binaries in the very same build/ that actions/checkout just
          # populated with this repo's own tracked *.sh scripts, and files: build/**/* below
          # swept those up into the release alongside the real assets.
          path: dist
          pattern: jiv881-*
          merge-multiple: true
      - run: ls -R dist
      # Rolling "latest" prerelease, rebuilt/overwritten on every push to main - unchanged
      # behaviour, still what the README's own download links point at. Was
      # marvinpinto/action-automatic-releases (2026-09-09: started failing here with an uncaught
      # exception right as it tried to talk to the GitHub API - that action has been unmaintained
      # for years and doesn't survive GitHub's Node 20->24 forced runner upgrade). Switched to the
      # same softprops/action-gh-release the tagged release below already uses - it upserts a
      # release by tag_name rather than requiring a brand new one each time, so pointing it at the
      # fixed "latest" tag reproduces the same rolling behaviour.
      - name: "Publish rolling latest prerelease"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: JiV-881 Latest
          prerelease: true
          generate_release_notes: true
          files: |
            dist/**/*
      # Permanent, versioned release (Alan's request, 2026-09-08 - "il faudra tagger et avoir
      # plusieurs versions, pas seulement latest") - only fires on a pushed `vX.Y.Z` tag, leaves
      # the rolling "latest" release above completely untouched, so both coexist in the repo's
      # Releases list. softprops/action-gh-release (actively maintained, pinned to a major
      # version) rather than reusing marvinpinto/action-automatic-releases here, since that one's
      # "automatic" release model is built around a single rolling tag, not creating a new
      # distinct release per tag.
      - name: "Publish tagged release"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "JiV-881 ${{ github.ref_name }}"
          prerelease: false
          generate_release_notes: true
          files: |
            dist/**/*
