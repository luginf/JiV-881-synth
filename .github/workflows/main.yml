# Based on https://github.com/OwlPlug/owlplug-scanner/blob/master/.github/workflows/main.yml
name: jiv881

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-linux:
    # JUCE 8.0.15's prebuilt Linux Projucer binary needs glibc >= 2.38 (confirmed by a failed run:
    # ubuntu-22.04's glibc 2.35 is too old, hence 24.04 here rather than the more conservative
    # 22.04 the other jobs might have used).
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Install Linux build dependencies"
      run: |
           sudo apt-get update
           sudo apt-get install -y libasound2-dev libjack-jackd2-dev ladspa-sdk \
             libcurl4-openssl-dev libfreetype-dev libfontconfig1-dev \
             libx11-dev libxcomposite-dev libxcursor-dev libxext-dev libxinerama-dev \
             libxrandr-dev libxrender-dev libglu1-mesa-dev mesa-common-dev \
             libwebkit2gtk-4.1-dev libgtk-3-dev
           # The generated Makefile queries pkg-config for webkit2gtk/gtk+alsa/freetype2/
           # fontconfig/libcurl in a single `pkg-config --cflags ...` call - if ANY one of them
           # is missing, pkg-config emits NOTHING for the whole call (not just skips that one),
           # silently dropping freetype2's/etc's own -I flags too and breaking the build with an
           # unrelated-looking "ft2build.h not found". Hence webkit2gtk/gtk here even though this
           # project doesn't use WebBrowserComponent - it's load-bearing for the other flags.
    - name: "Download Projucer"
      run: |
           git clone -b 8.0.15 --depth 1 https://github.com/juce-framework/JUCE JUCE
           bash -ex ./build/download-projucer.sh
      shell: bash
      env:
        OS: linux
    - name: "Build jiv881"
      run: bash -ex ./build/build-linux.sh
    - name: "Build .deb"
      run: bash -ex ./build/build-deb.sh
    - name: "zip Linux"
      run: |
           cd ./Builds/LinuxMakefile/build
           zip -r JiV-881.vst3.linux.zip JiV-881.vst3
           zip -r JiV-881.lv2.linux.zip JiV-881.lv2
           cp JiV-881 JiV-881.linux
           cd -
      shell: bash
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jiv881-linux
        path: |
              ./Builds/LinuxMakefile/build/JiV-881.vst3.linux.zip
              ./Builds/LinuxMakefile/build/JiV-881.lv2.linux.zip
              ./Builds/LinuxMakefile/build/JiV-881.linux
              ./build/*.deb
  build-win:
    runs-on: windows-2022
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Download Projucer"
      run: |
           git clone -b 8.0.15 --depth 1 https://github.com/juce-framework/JUCE JUCE
           bash -ex ./build/download-projucer.sh
      shell: bash
      env:
        OS: windows
    - name: "Build jiv881"
      run: sh -ex ./build/build-win.sh
      shell: bash
    - name: "zip Windows VST3"
      # jiv881.vst3 is itself a bundle directory (Contents/x86_64-win/jiv881.vst3 +
      # Contents/Resources/moduleinfo.json), not a flat file - uploading it raw got flattened by
      # the release job's merge-multiple, scattering moduleinfo.json loose and leaving a bare
      # "jiv881.vst3" that was really just the inner DLL, not a valid bundle. Zip it like the
      # macOS/Linux jobs already do for their own bundles - `zip` itself isn't available in the
      # windows-2022 runner's Git-Bash, so PowerShell's Compress-Archive instead (needs the -Path
      # itself, not just its parent, since Git-Bash's cd above doesn't carry over to this step).
      run: Compress-Archive -Path "./Builds/VisualStudio2022/x64/Release/VST3/jiv881.vst3" -DestinationPath "./Builds/VisualStudio2022/x64/Release/VST3/jiv881.vst3.windows.zip"
      shell: pwsh
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jiv881-win
        path: |
              ./Builds/VisualStudio2022/x64/Release/VST3/jiv881.vst3.windows.zip
              ./Builds/VisualStudio2022/x64/Release/Standalone Plugin/jiv881.exe
  build-osx:
    runs-on: macos-15
    steps:
    - uses: actions/checkout@v3.3.0
      with:
        fetch-depth: 0
        submodules: recursive
    - name: "Download Projucer"
      run: |
           git clone -b 8.0.15 --depth 1 https://github.com/juce-framework/JUCE JUCE
           bash -ex ./build/download-projucer.sh
      shell: bash
      env:
        OS: osx
    - name: "Build macOS"
      run: sh -ex ./build/build-osx.sh
      shell: bash
    - name: "zip macOS"
      run: |
           cd ./Builds/MacOSX/build/Release/
           zip -r jiv881.vst3.macOS.zip jiv881.vst3
           zip -r jiv881.component.macOS.zip jiv881.component
           zip -r jiv881.app.macOS.zip jiv881.app
           cd -
      shell: bash
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: jiv881-osx
        path: |
              ./Builds/MacOSX/build/Release/jiv881.vst3.macOS.zip
              ./Builds/MacOSX/build/Release/jiv881.component.macOS.zip
              ./Builds/MacOSX/build/Release/jiv881.app.macOS.zip
  release:
    name: "Release"
    needs: [build-linux, build-win, build-osx]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: "ubuntu-latest"
    # This repo's default GITHUB_TOKEN permissions are read-only (Settings > Actions > General),
    # which made action-automatic-releases fail with "Resource not accessible by integration" -
    # explicitly requesting contents:write here overrides that default for just this job, rather
    # than loosening every job's token repo-wide.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v3.3.0
      - name: Retrieve artifacts
        uses: actions/download-artifact@v4
        with:
          # A directory that doesn't already exist in the checked-out repo - `path: build` used
          # to land the downloaded binaries in the very same build/ that actions/checkout just
          # populated with this repo's own tracked *.sh scripts, and files: build/**/* below
          # swept those up into the release alongside the real assets.
          path: dist
          pattern: jiv881-*
          merge-multiple: true
      - run: ls -R dist
      # Rolling "latest" prerelease, rebuilt/overwritten on every push to main - unchanged
      # behaviour, still what the README's own download links point at. Was
      # marvinpinto/action-automatic-releases (2026-09-09: started failing here with an uncaught
      # exception right as it tried to talk to the GitHub API - that action has been unmaintained
      # for years and doesn't survive GitHub's Node 20->24 forced runner upgrade). Switched to the
      # same softprops/action-gh-release the tagged release below already uses - it upserts a
      # release by tag_name rather than requiring a brand new one each time, so pointing it at the
      # fixed "latest" tag reproduces the same rolling behaviour.
      - name: "Publish rolling latest prerelease"
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: jiv881 Latest
          prerelease: true
          generate_release_notes: true
          files: |
            dist/**/*
      # Permanent, versioned release (Alan's request, 2026-09-08 - "il faudra tagger et avoir
      # plusieurs versions, pas seulement latest") - only fires on a pushed `vX.Y.Z` tag, leaves
      # the rolling "latest" release above completely untouched, so both coexist in the repo's
      # Releases list. softprops/action-gh-release (actively maintained, pinned to a major
      # version) rather than reusing marvinpinto/action-automatic-releases here, since that one's
      # "automatic" release model is built around a single rolling tag, not creating a new
      # distinct release per tag.
      - name: "Publish tagged release"
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "jiv881 ${{ github.ref_name }}"
          prerelease: false
          generate_release_notes: true
          files: |
            dist/**/*
